<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enter · {{ app_name }}</title>
  {% include "head_links.html" %}
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="login-shell">
    <div class="panel login-card">
      <p class="eyebrow">Just the two of you</p>
      <h1 class="brand-mark">{{ app_name }}</h1>
      <p class="lede">Write until you are ready. Nothing crosses until you send it and they choose to open it. What you both keep stays here.</p>
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      <form method="post" action="/login">
        <label for="username">Name</label>
        <input id="username" name="username" type="text" autocomplete="username" required value="{{ username or '' }}" {% if not username %}autofocus{% endif %}>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required {% if username %}autofocus{% endif %}>
        <button class="full" type="submit">Come in</button>
      </form>
    </div>
  </div>
  <script src="/static/room.js" defer></script>
</body>
</html>
