<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enter · {{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="login-shell">
    <div class="panel login-card">
      <p class="eyebrow">Just the two of you</p>
      <h1 class="brand-mark">{{ app_name }}</h1>
      <p class="lede">Write until you are ready. Nothing crosses until you send it and they choose to open it. What you both keep stays here.</p>
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <form method="post" action="/login">
        <label for="username">Name</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="full" type="submit">Come in</button>
      </form>
    </div>
  </div>
</body>
</html>
