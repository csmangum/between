<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enter · {{ app_name }}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="login-shell">
    <div class="card login-card">
      <p class="meta">A private room for two</p>
      <h1>{{ app_name }}</h1>
      <p class="lede">Write on your own desk. The other person sees nothing until you offer it and they agree to receive it.</p>
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <form method="post" action="/login">
        <label for="username">Name</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="full" type="submit">Enter</button>
      </form>
    </div>
  </div>
</body>
</html>
