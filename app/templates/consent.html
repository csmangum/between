{% extends "base.html" %}
{% block title %}Agree to see · {{ topic.title }}{% endblock %}
{% block body %}
<p class="meta"><a href="/">← Desk</a></p>
<div class="consent-shell">
  <section class="consent-letter">
    <p class="eyebrow">Sealed offer</p>
    <h1 class="page-title">{{ topic.title }}</h1>
    <p class="lede">{{ display_for(topic.created_by) }} wants to share this topic with you. The writings, comments, and notes stay hidden until you agree.</p>
    <div class="actions">
      <form method="post" action="/topics/{{ topic.id }}/accept">
        <button type="submit">Agree and open</button>
      </form>
      <form method="post" action="/topics/{{ topic.id }}/decline">
        <button class="ghost" type="submit">Decline</button>
      </form>
    </div>
  </section>
</div>
{% endblock %}
