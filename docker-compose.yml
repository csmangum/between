services:
  between:
    build: .
    # Loopback only. Put a TLS proxy in front before exposing this to anyone else.
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      APP_NAME: ${APP_NAME:-Between}
      USER1_NAME: ${USER1_NAME:-chris}
      USER1_DISPLAY: ${USER1_DISPLAY:-Chris}
      USER1_PASSWORD: ${USER1_PASSWORD:-}
      USER1_PASSWORD_HASH: ${USER1_PASSWORD_HASH:-}
      USER2_NAME: ${USER2_NAME:-friend}
      USER2_DISPLAY: ${USER2_DISPLAY:-Friend}
      USER2_PASSWORD: ${USER2_PASSWORD:-}
      USER2_PASSWORD_HASH: ${USER2_PASSWORD_HASH:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_BASE_URL: ${AGENT_BASE_URL:-https://api.x.ai/v1}
      AGENT_MODEL: ${AGENT_MODEL:-grok-4}
      HTTPS_ONLY: ${HTTPS_ONLY:-}
      MARKDOWN_MIRROR: ${MARKDOWN_MIRROR:-true}
      DATABASE_URL: sqlite:////data/between.db
    # The container runs as uid 1000. `sudo chown -R 1000:1000 data` once if this directory already exists.
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
